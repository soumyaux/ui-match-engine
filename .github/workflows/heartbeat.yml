name: 💓 Worker Heartbeat

# Pings the production worker every 30 minutes. A failed run means the worker is down:
# GitHub emails the repo owner about failed scheduled runs. /health makes no outside
# requests, so this costs nothing on the Workers Free plan's limits.
# The worker's weekly cron re-enables this and every other engine workflow (report/weekly.js),
# so GitHub's 60-day inactivity pause cannot stop it for good.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping the worker
        run: |
          # 3 tries, 20 s apart: one network blip is not an outage
          for i in 1 2 3; do
            BODY=$(curl -fsS --max-time 20 https://ui-match-proxy.soumyasahoo473.workers.dev/health) && echo "$BODY" | grep -q '"ok":true' && { echo "✅ Worker is up"; exit 0; }
            echo "Try $i failed: ${BODY:-no answer}"
            sleep 20
          done
          echo "::error title=Worker down::https://ui-match-proxy.soumyasahoo473.workers.dev/health did not answer ok 3 times"
          exit 1
