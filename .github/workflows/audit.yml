name: UI Match Audit

on:
  workflow_dispatch:
    inputs:
      scan_id:
        description: "Supabase Scan ID"
        required: true
      # The repo is public, and so are its run logs: the worker sends only scan_id and the
      # first step fetches the rest from it. The inputs below are accepted (a worker still
      # sending them must not get a 422) but never used.
      url:
        description: "Unused (fetched from the worker)"
        required: false
        default: ""
      session_id:
        description: "Unused (fetched from the worker)"
        required: false
        default: ""
      tokens_url:
        description: "Unused (fetched from the worker)"
        required: false
        default: ""
      figma_image_url:
        description: "Unused (fetched from the worker)"
        required: false
        default: ""
      frame_name:
        description: "Unused (fetched from the worker)"
        required: false
        default: ""
      capture_base:
        description: "Unused (fetched from the worker)"
        required: false
        default: ""
      env:
        description: "production | staging - picks the GitHub Environment (and its secrets)"
        required: false
        default: "production"

permissions:
  contents: read

jobs:
  audit:
    # Pinned: Playwright can't install Chromium on ubuntu-26.04 (ubuntu-latest) yet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Staging runs use the `staging` Environment's secrets (its own Supabase project);
    # without Environment secrets the repository secrets apply, as before
    environment: ${{ github.event.inputs.env || 'production' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: 🚦 Mark Running
        env:
          SID: ${{ github.event.inputs.scan_id }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Only a scan still waiting to start: a cancel from the plugin must stick
          curl -sX PATCH "${SB_URL}/rest/v1/scan_history?id=eq.${SID}&audit_status=in.(processing,awaiting_capture)" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d '{"audit_status": "running"}'

      # Website, frame name and signed file links come from the worker, never from the
      # dispatch, and are never printed (the website is masked in every later step)
      - name: 📥 Download Inputs
        run: node fetch-inputs.js
        env:
          SCAN_ID: ${{ github.event.inputs.scan_id }}
          WORKER_URL: ${{ secrets.UIMATCH_WORKER_URL }}
          FINISH_SECRET: ${{ secrets.FINISH_SECRET }}

      # Single combined cache (was two separate cache steps = two sequential
      # restore round-trips). node_modules and the Playwright browser always
      # hit/miss together since they share the same key inputs.
      - name: 📦 Cache Dependencies + Playwright Browser
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-v2-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-v2-

      - name: Install Dependencies + Browser
        id: install
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 🔍 Run Audit Engine
        run: node engine.js
        env:
          # TARGET_URL, FRAME_NAME and the captured-mode files come from 📥 Download Inputs
          TOKENS_FILE: tokens.json
          FIGMA_IMAGE: figma-frame.png
          SCAN_ID: ${{ github.event.inputs.scan_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 📸 Upload PDF Report to Supabase
        if: always()
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FINAL_ID="${SESSION_ID:-manual_run}"
          if [ -f "playwright-report/visual-audit-diff.pdf" ]; then
            curl -sX POST "${SB_URL}/storage/v1/object/audit-results/${FINAL_ID}.pdf" \
              -H "Authorization: Bearer $SB_KEY" \
              -H "Content-Type: application/pdf" \
              -H "x-upsert: true" \
              --data-binary @"playwright-report/visual-audit-diff.pdf"
            echo "PDF uploaded"
          else
            echo "No PDF found"
          fi

      # Web report data (v2): images to the PRIVATE `reports` bucket at <scan_id>/, and the
      # issue list (audit-results.json minus the raw probe output) into scan_history.results.
      # Runs before "Mark Completed" so a finished scan always has its report data. Never
      # fails the audit: before schema.sql §9 exists the PATCH is rejected and ignored.
      - name: 🧾 Save Web Report Data
        if: ${{ success() && github.event.inputs.scan_id != '' }}
        continue-on-error: true
        env:
          SID: ${{ github.event.inputs.scan_id }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for f in live.jpg figma.png diff.png; do
            [ -f "playwright-report/$f" ] || continue
            case "$f" in *.jpg) CT=image/jpeg ;; *) CT=image/png ;; esac
            curl -sfX POST "${SB_URL}/storage/v1/object/reports/${SID}/${f}" \
              -H "Authorization: Bearer $SB_KEY" \
              -H "Content-Type: $CT" -H "x-upsert: true" \
              --data-binary @"playwright-report/$f" > /dev/null && echo "Uploaded $f" || echo "⚠️ $f upload failed"
          done
          jq -c '{results: del(.tokens), results_version: (.schemaVersion // 1)}' playwright-report/audit-results.json > results-patch.json
          curl -sfX PATCH "${SB_URL}/rest/v1/scan_history?id=eq.${SID}" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data-binary @results-patch.json && echo "Results saved ($(wc -c < results-patch.json) bytes)" || echo "⚠️ results not saved (schema.sql §9 not applied yet?)"

      # One finish step for both outcomes. It goes through the worker, which saves the status
      # (only while the scan is still in flight, so a cancel from the plugin sticks) and
      # emails the saved address - the report link, or what went wrong - so the user hears
      # back even with the plugin closed.
      # always(): a run that hit timeout-minutes is marked failed too, not left "running".
      # Needs the UIMATCH_WORKER_URL and FINISH_SECRET secrets. Without them, or if the worker
      # can't be reached, the status is written straight to Supabase as before (no email).
      - name: 🏁 Mark Completed / Failed
        if: ${{ always() && github.event.inputs.scan_id != '' }}
        env:
          OUTCOME: ${{ job.status }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SID: ${{ github.event.inputs.scan_id }}
          WORKER_URL: ${{ secrets.UIMATCH_WORKER_URL }}
          FINISH_SECRET: ${{ secrets.FINISH_SECRET }}
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            TRUE_SCORE=$(jq -r '.trueMatchScore // 0' playwright-report/audit-results.json 2>/dev/null || echo 0)
            VISUAL_SCORE=$(jq -r '.visualMatchScore // 0' playwright-report/audit-results.json 2>/dev/null || echo 0)
            jq -nc --argjson t "${TRUE_SCORE:-0}" --argjson v "${VISUAL_SCORE:-0}" \
              '{status: "completed", true_match_percent: $t, visual_match_percent: $v}' > finish.json
            jq -c '{audit_status: .status, true_match_percent, visual_match_percent}' finish.json > direct.json
          else
            ERROR_MSG="Audit failed unexpectedly."
            [ "$OUTCOME" = "cancelled" ] && ERROR_MSG="The audit took too long and was stopped. Please try again."
            [ -f "playwright-report/error-log.txt" ] && ERROR_MSG=$(head -c 500 playwright-report/error-log.txt)
            # The engine never ran: say so, instead of blaming the website
            [ "$INSTALL_OUTCOME" = "failure" ] && ERROR_MSG="Audit setup failed (browser install) - not the website. Check the engine run on GitHub."
            jq -nc --arg e "$ERROR_MSG" '{status: "failed", error_message: $e}' > finish.json
            jq -c '{audit_status: .status, error_message}' finish.json > direct.json
            # Show the reason on the run page + as an annotation, so GitHub's failure email
            # leads to it. This repo is public: scan id + reason only, web addresses hidden.
            SAFE_MSG=$(printf '%s' "$ERROR_MSG" | sed -E 's#(https?://|www\.)[^[:space:]]+#[link hidden]#g; s#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}#[email hidden]#g' | tr '\r\n' '  ' | head -c 400)
            {
              echo "## ❌ Audit failed"
              echo ""
              echo "**Scan ID:** \`${SID}\`"
              echo ""
              echo '**Reason:**'
              echo '```'
              printf '%s\n' "$SAFE_MSG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Audit failed (scan ${SID})::${SAFE_MSG}"
          fi
          if [ -n "$WORKER_URL" ] && [ -n "$FINISH_SECRET" ] && \
             curl -sf --retry 2 --max-time 90 -X POST "${WORKER_URL%/}/api/scan/${SID}/finish" \
               -H "X-Finish-Secret: $FINISH_SECRET" -H "Content-Type: application/json" \
               --data-binary @finish.json; then
            echo; echo "Finished through the worker"
          else
            echo "⚠️ Worker finish unavailable - writing the status directly (no email)"
            curl -sf --retry 2 -X PATCH "${SB_URL}/rest/v1/scan_history?id=eq.${SID}&audit_status=in.(processing,awaiting_capture,running)" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              --data-binary @direct.json
          fi
